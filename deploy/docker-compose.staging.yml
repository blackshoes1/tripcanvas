# 리허설·디버그 전용 override. **운영은 이걸 겹치지 않는다** —
# 겹쳐야만 운영이 도는 상태였던 것을 2026-09-05에 끝냈다(loopback publish는 base로 옮겼다).
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.staging.yml up -d
#
# 하는 일은 하나다: **PostgreSQL을 호스트 루프백에 낸다.** 복원 리허설·데이터 이관·스키마 확인처럼
# DB에 직접 붙어야 할 때만 쓰고, 끝나면 이 override 없이 다시 올려 원래대로 닫는다(§54).
#
# ⚠️ postgres는 원래 internal 네트워크에만 있다. 포트를 내려면 edge에도 붙어야 하므로 여기서만 그렇게 한다.
# ⚠️ DSM 자체 PostgreSQL이 5432를 이미 쓴다 — 호스트 쪽은 15432다.
# ⚠️ 127.0.0.1 바인딩이어도 **tailnet 안에서는 닿는다**(Tailscale이 tailnet 트래픽을 localhost로 넘긴다).
#    올려둔 채로 잊지 말 것.
name: tripcanvas

services:
  postgres:
    networks: [internal, edge]
    ports: ["127.0.0.1:15432:5432"]
