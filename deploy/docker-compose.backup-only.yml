# NAS의 새 역할(전환 뒤) — **오프사이트 백업 목적지**. API·실시간·PostgreSQL은 관리형에 있고,
# 여기서는 backup 컨테이너 하나만 돌며 관리형 DB의 pg_dump를 NAS 디스크로 당겨 온다(docs/disaster-recovery.md).
#
#   cd ~/tripcanvas && sudo docker compose -f deploy/docker-compose.backup-only.yml up -d
#
# 운영 compose(docker-compose.yml)와 프로젝트 이름이 다르다 — 겹쳐 올리는 override가 아니라 **따로 뜨는 스택**이다.
# 관찰 기간에는 둘이 함께 떠 있어도 된다(운영 compose는 롤백 대상으로 남긴다).
#
# BACKUP_SOURCE_URL은 관리형 DB의 **직접** 주소(풀러 아님)이고 .env에만 둔다. 출력에 절대 나오지 않는다.
# 성공하면 ops_backup_runs에 한 행 남기고(/api/health가 읽는다) 하루 쉬며, 실패하면 5분 뒤 다시 한다.
name: tripcanvas-backup

services:
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      BACKUP_SOURCE_URL: ${BACKUP_SOURCE_URL:?BACKUP_SOURCE_URL(관리형 DB 직접 주소) 필요}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_DESTINATION: nas
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh && sleep ${BACKUP_INTERVAL_SECONDS:-21600} || sleep 300; done"]
    # Up이어도 덤프가 오래됐으면 실패다(26시간). 관리형 쪽의 /api/health도 같은 사실을 ops_backup_runs로 본다
    healthcheck:
      test: ["CMD-SHELL", "find /backups -type f -name 'tripcanvas-*.dump' -size +0c -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m
