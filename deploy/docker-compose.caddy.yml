# 도메인 + Caddy로 갈 때만 겹친다. **오늘의 운영 경로가 아니다** —
# 지금 인터넷에서 들어오는 길은 Tailscale Funnel이고, Funnel은 호스트 루프백(3000·3001)으로 바로 넘긴다.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.caddy.yml up -d
#
# 이 파일을 쓰면 80·443이 열리고 Caddy가 인증서를 받는다 — 그 전에 도메인 A/AAAA 레코드와
# 공유기 포트포워딩이 있어야 한다. DSM이 80·443을 이미 쓰고 있으면 충돌한다.
# ⚠️ 겹치는 순간 api·realtime의 루프백 publish는 그대로 남는다. 도메인으로 완전히 옮겼다면
#    그때 base의 ports를 지우고 expose로 되돌린다(그 전에는 Funnel이 유일한 길이라 지우면 안 된다).
name: tripcanvas

services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      # ⚠️ 따옴표를 벗기지 말 것 — :? 뒤 메시지에 콜론이 들어가면 YAML이 매핑으로 읽어 파일 전체가 안 열린다
      API_DOMAIN: "${API_DOMAIN:?API_DOMAIN 필요 — 예 api.example.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [api, realtime]

networks:
  edge: {}

volumes:
  caddy_data:
  caddy_config:
