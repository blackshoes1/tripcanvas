# TripCanvas 독립 Backend — NAS 배포(§52~§56). 외부에 열리는 것은 reverse-proxy(443)뿐이다.
# PostgreSQL 5432·(나중의) MinIO는 내부 네트워크에만 있다.
#   cp deploy/.env.example deploy/.env  →  값 채우기  →  docker compose -f deploy/docker-compose.yml up -d
# ⚠️ 작성 환경에 Docker가 없어 미검증 — docs/nas-deployment.md.
name: tripcanvas

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripcanvas}
      POSTGRES_USER: ${POSTGRES_USER:-tripcanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripcanvas} -d ${POSTGRES_DB:-tripcanvas}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 스키마 적용(일회성). api보다 먼저 성공해야 한다 — 코드로 관리하는 마이그레이션(§62)
  migrate:
    build:
      context: ..
      dockerfile: next/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tripcanvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tripcanvas}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: next/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tripcanvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tripcanvas}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, edge]
    expose: ["3000"]

  # 실시간(§42) — trip_activity 트리거의 pg_notify를 듣고 WebSocket으로 중계한다. 죽어도 앱은 돈다(폴백은 API 재조회)
  realtime:
    build:
      context: ..
      dockerfile: next/Dockerfile
      target: realtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tripcanvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tripcanvas}
      REALTIME_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, edge]
    expose: ["3001"]

  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN 필요 (예: api.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [api, realtime]

  # 매일 pg_dump(§59). 백업은 DB 볼륨과 다른 볼륨/경로에 둔다(§60) — NAS 스냅샷·오프사이트 복제는 NAS 쪽 설정
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tripcanvas}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-tripcanvas}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    internal: true     # 인터넷으로 나가지도, 들어오지도 않는다
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
