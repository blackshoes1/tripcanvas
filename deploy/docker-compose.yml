# TripCanvas 독립 Backend — NAS 운영(§52~§56).
#
#   cp deploy/.env.example deploy/.env  →  값 채우기  →  scripts/nas-deploy.sh
#
# ⚠️ **운영은 소스를 빌드하지 않는다**(2026-09-19). api·migrate·realtime은 GHCR에서 받은
# **커밋 SHA로 고정된** 이미지를 띄운다 — 셋이 `TC_IMAGE_TAG` 하나를 같이 보므로 서로 다른 커밋이
# 섞일 수 없다. 태그가 비어 있으면 뜨지 않는다(`:?`) — 어느 커밋인지 모르는 채로 운영이 도는 일이 없게.
# 비상시(레지스트리 장애 등) 손으로 빌드하려면 `docker-compose.build.yml`을 겹친다.
#
# **이 파일 하나로 운영이 뜬다.** override를 겹쳐야만 도는 상태로 두지 않는다 —
# 2026-09-04~09-05에는 loopback publish가 docker-compose.staging.yml에만 있어서
# 그 파일을 빼고 올리면 Funnel이 닿을 곳이 없어 API가 통째로 죽었다.
#
# 인터넷에서 들어오는 길(오늘의 실제 구조):
#
#   Internet → Tailscale Funnel(HTTPS) → 127.0.0.1:3000 (api) / 127.0.0.1:3001 (realtime)
#
# 그래서 api·realtime은 **호스트 루프백에만** 낸다(0.0.0.0 아님). PostgreSQL은 internal 네트워크에만 있어
# 호스트에도 나오지 않는다 — 리허설로 붙을 때만 docker-compose.staging.yml을 겹친다.
# 도메인 + Caddy로 갈 때는 docker-compose.caddy.yml을 겹친다(오늘은 쓰지 않는다).
name: tripcanvas

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripcanvas}
      POSTGRES_USER: ${POSTGRES_USER:-tripcanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripcanvas} -d ${POSTGRES_DB:-tripcanvas}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 스키마 적용(일회성). api보다 먼저 성공해야 한다 — 코드로 관리하는 마이그레이션(§62)
  migrate:
    image: ${TC_IMAGE_REPO:-ghcr.io/blackshoes1/tripcanvas}/tools:${TC_IMAGE_TAG:?TC_IMAGE_TAG 필요 - scripts/nas-deploy.sh가 채운다}
    command: ["npx", "drizzle-kit", "migrate"]
    # 한 번 돌고 끝나는 컨테이너다 — 공용 tools 이미지의 헬스체크(실시간용 3001)는 여기서 뜻이 없다
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tripcanvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tripcanvas}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    image: ${TC_IMAGE_REPO:-ghcr.io/blackshoes1/tripcanvas}/api:${TC_IMAGE_TAG:?TC_IMAGE_TAG 필요 - scripts/nas-deploy.sh가 채운다}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tripcanvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tripcanvas}
      # /api/health가 실시간(LISTEN)과 백업 최신성(ops_backup_runs)까지 보고한다 — 내부 주소라 밖에 나가지 않는다
      REALTIME_HEALTH_URL: http://realtime:3001/health
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, edge]
    # Tailscale Funnel이 호스트의 루프백으로 넘긴다. 0.0.0.0에 열지 않는다 —
    # ⚠️ tailnet 안의 기기에서는 이 포트에 닿는다(Tailscale이 tailnet 트래픽을 localhost로 넘긴다).
    ports: ["127.0.0.1:3000:3000"]

  # 실시간(§42) — trip_activity 트리거의 pg_notify를 듣고 WebSocket으로 중계한다. 죽어도 앱은 돈다(폴백은 API 재조회)
  realtime:
    image: ${TC_IMAGE_REPO:-ghcr.io/blackshoes1/tripcanvas}/tools:${TC_IMAGE_TAG:?TC_IMAGE_TAG 필요 - scripts/nas-deploy.sh가 채운다}
    command: ["node", "dist-tools/server/realtime/main.js"]
    # migrate와 같은 이미지라 타깃에 박힌 헬스체크가 없다 — 여기서 준다
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tripcanvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tripcanvas}
      REALTIME_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal, edge]
    ports: ["127.0.0.1:3001:3001"]

  # 매일 pg_dump(§59). 백업은 DB 볼륨과 다른 볼륨/경로에 둔다(§60) — NAS 스냅샷·오프사이트 복제는 NAS 쪽 설정
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tripcanvas}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-tripcanvas}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # 성공 기록(ops_backup_runs)에 남는 목적지 이름 — 경로·주소가 아니라 한 단어
      BACKUP_DESTINATION: nas
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # 성공하면 하루 쉬고, 실패하면 5분 뒤 다시 — 재부팅 직후처럼 일시적인 실패로
    # **하루를 통째로 건너뛰지 않게** 한다.
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh && sleep 86400 || sleep 300; done"]
    # Up이어도 덤프가 오래됐으면 실패다. health 상태를 알림으로 전달하는 것은 별도 운영 설정.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -type f -name 'tripcanvas-*.dump' -size +0c -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    internal: true     # 인터넷으로 나가지도, 들어오지도 않는다
  edge: {}

volumes:
  pgdata:
