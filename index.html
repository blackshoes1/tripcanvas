<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Trip Canvas · 대화로 만드는 여행 동선 지도</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16213e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TripCanvas">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;height:100dvh;display:flex;flex-direction:column;background:#1a1a2e;color:#e8e8f0}
  button{font-family:inherit;cursor:pointer}
  header{background:#16213e;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:1001}
  header h1{font-size:16px;font-weight:800;color:#fff;margin-right:4px}
  select,input,textarea{font-family:inherit;background:#0f1830;color:#e8e8f0;border:1px solid #2a3457;border-radius:8px;padding:6px 9px;font-size:13px}
  .btn{border:none;border-radius:8px;padding:6px 12px;font-size:12.5px;background:#2a3457;color:#cdd6f4;transition:.15s}
  .btn:hover{filter:brightness(1.3)}
  .btn.primary{background:#e63946;color:#fff;font-weight:700}
  .btn.ghost{background:transparent;border:1px solid #2a3457}
  #filterbar{background:#16213e;padding:0 12px 8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;z-index:1001}
  .chip{border:none;border-radius:14px;padding:4px 11px;font-size:12px;background:#2a3457;color:#cdd6f4}
  .chip.active{background:#e63946;color:#fff;font-weight:700}
  .citychip.active{background:var(--c);color:#fff}
  #main{flex:1;display:flex;overflow:hidden;position:relative}
  #sidebar{width:340px;min-width:340px;background:#16213e;overflow-y:auto;padding:10px}
  #map{flex:1}
  .dayCard{background:#1f2b4d;border-radius:10px;margin-bottom:8px}
  .dayCard.dim{opacity:.4}
  .dayHead{padding:8px 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-left:4px solid var(--c,#556);border-radius:10px 0 0 0}
  .dayHead .date{color:#9aa5c4;font-weight:400;font-size:11.5px}
  .dayHead .tools{display:flex;gap:4px}
  .iconb{background:none;border:none;color:#8892b0;font-size:13px;padding:2px 4px;border-radius:5px}
  .iconb:hover{color:#fff;background:#2a3457}
  .dayBody{padding:2px 12px 9px}
  .drive{font-size:11.5px;color:#f6bd60;padding:2px 0 4px 2px}
  .note{font-size:11px;color:#9aa5c4;padding:3px 0 0 2px;white-space:pre-wrap}
  .spot{font-size:12.5px;padding:3px 0 3px 14px;position:relative;display:flex;align-items:center;gap:4px}
  .spot:before{content:'';position:absolute;left:2px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--c,#888)}
  .spot .nm{cursor:pointer;flex:1}
  .spot .nm:hover{color:#fff;text-decoration:underline}
  .spot .opt{color:#8892b0;font-size:11px}
  .spot .tools{display:none;gap:2px}
  .spot:hover .tools{display:flex}
  .addSpot{font-size:11.5px;color:#7ea6e0;background:none;border:1px dashed #2a3457;border-radius:7px;padding:3px 10px;margin-top:5px}
  #addDayBtn{width:100%;margin-top:2px;padding:8px;font-size:12.5px}
  .legend{position:absolute;bottom:20px;right:10px;background:rgba(22,33,62,.92);padding:8px 12px;border-radius:10px;font-size:11px;z-index:1000;line-height:1.8;max-height:40vh;overflow-y:auto}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .num-icon{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;font-size:12px;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  .leaflet-popup-content{font-family:inherit;font-size:13px;line-height:1.5;min-width:190px}
  .leaflet-popup-content h3{font-size:14px;margin-bottom:3px}
  .leaflet-popup-content .badge{display:inline-block;font-size:10.5px;color:#fff;border-radius:8px;padding:1px 8px;margin-bottom:4px}
  .leaflet-popup-content a{color:#1d6fd6;font-size:12px}
  /* modal */
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:2000}
  .modalBg.show{display:flex}
  .modal{background:#1f2b4d;border-radius:14px;padding:18px;width:min(420px,92vw);max-height:88dvh;overflow-y:auto}
  .modal h2{font-size:15px;margin-bottom:12px}
  .modal label{display:block;font-size:11.5px;color:#9aa5c4;margin:9px 0 3px}
  .modal input[type=text],.modal input[type=date],.modal select,.modal textarea{width:100%}
  .modal textarea{min-height:60px;resize:vertical}
  .modal .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
  .modal .chkrow{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px}
  .searchRes{margin-top:6px;max-height:170px;overflow-y:auto}
  .searchRes div{font-size:12px;padding:6px 8px;border-radius:7px;cursor:pointer;color:#cdd6f4}
  .searchRes div:hover{background:#2a3457}
  .hint{font-size:11px;color:#8892b0;margin-top:4px}
  /* travel mode */
  #travel{position:fixed;inset:0;background:#12192e;z-index:3000;display:none;flex-direction:column;padding:16px}
  #travel.show{display:flex}
  #travel h2{font-size:17px;margin-bottom:2px}
  #travel .sub{font-size:12px;color:#9aa5c4;margin-bottom:12px}
  #travel .list{flex:1;overflow-y:auto}
  .tSpot{background:#1f2b4d;border-radius:12px;padding:12px 14px;margin-bottom:9px;border-left:4px solid var(--c,#556)}
  .tSpot .n{font-weight:700;font-size:14.5px}
  .tSpot .d{font-size:12px;color:#9aa5c4;margin:3px 0 7px;white-space:pre-wrap}
  .tSpot a{display:inline-block;font-size:12.5px;color:#fff;background:#1d6fd6;border-radius:8px;padding:5px 12px;text-decoration:none}
  #pickBanner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#e63946;color:#fff;font-size:13px;font-weight:700;padding:7px 16px;border-radius:20px;z-index:1500;display:none}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a9d3f;color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;z-index:4000;display:none}
  @media (max-width:760px){
    #main{flex-direction:column}
    #sidebar{width:100%;min-width:0;max-height:42dvh;order:2}
    header h1{font-size:14px}
  }
</style>
</head>
<body>
<header>
  <h1>🗺 Trip Canvas</h1>
  <select id="tripSel"></select>
  <button class="btn" id="newTripBtn">＋ 새 여행</button>
  <button class="btn" id="tripEditBtn">여행 설정</button>
  <span style="flex:1"></span>
  <button class="btn primary" id="travelBtn">📍 여행 모드</button>
  <button class="btn ghost" id="shareBtn">🔗 공유</button>
  <button class="btn ghost" id="offlineBtn" title="일정 주변 지도를 미리 내려받아 오프라인에서도 보이게 합니다">⬇ 오프라인 준비</button>
  <button class="btn ghost" id="exportBtn">내보내기</button>
  <button class="btn ghost" id="importBtn">가져오기</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</header>
<div id="filterbar"></div>
<div id="main">
  <aside id="sidebar"></aside>
  <div id="map"></div>
  <div id="pickBanner">지도를 클릭해 위치를 지정하세요 (ESC 취소)</div>
  <div class="legend" id="legend"></div>
</div>

<!-- 명소 추가/편집 모달 -->
<div class="modalBg" id="spotModalBg"><div class="modal">
  <h2 id="spotModalTitle">명소 추가</h2>
  <label>장소 검색 (OpenStreetMap)</label>
  <div style="display:flex;gap:6px">
    <input type="text" id="spotSearch" placeholder="예: Puente Nuevo Ronda" style="flex:1">
    <button class="btn" id="spotSearchBtn">검색</button>
  </div>
  <div class="searchRes" id="searchRes"></div>
  <div class="hint">또는 <button class="btn" id="pickOnMap" style="font-size:11px;padding:2px 8px">지도 클릭으로 위치 지정</button></div>
  <label>이름 *</label><input type="text" id="spotName">
  <label>도시/그룹 * (같은 이름 = 같은 색)</label><input type="text" id="spotCity" placeholder="예: 마드리드">
  <label>메모 (운영시간, 예약, 팁 등)</label><textarea id="spotDesc"></textarea>
  <label>일자</label><select id="spotDay"></select>
  <div class="chkrow"><input type="checkbox" id="spotOpt"><label for="spotOpt" style="margin:0">선택 코스 (흐린 핀)</label></div>
  <input type="hidden" id="spotLat"><input type="hidden" id="spotLng">
  <div class="hint" id="coordHint">좌표: 미지정</div>
  <div class="row">
    <button class="btn" id="spotDelBtn" style="margin-right:auto;color:#ff8fa3;display:none">삭제</button>
    <button class="btn" id="spotCancel">취소</button>
    <button class="btn primary" id="spotSave">저장</button>
  </div>
</div></div>

<!-- 일자 편집 모달 -->
<div class="modalBg" id="dayModalBg"><div class="modal">
  <h2 id="dayModalTitle">일자 편집</h2>
  <label>제목 (예: → 세비야 (2박))</label><input type="text" id="dayTitle">
  <label>이동 정보 (예: 🚗 128km · 1시간 45분)</label><input type="text" id="dayDrive">
  <label>메모</label><textarea id="dayNote"></textarea>
  <div class="row">
    <button class="btn" id="dayDelBtn" style="margin-right:auto;color:#ff8fa3">일자 삭제</button>
    <button class="btn" id="dayCancel">취소</button>
    <button class="btn primary" id="daySave">저장</button>
  </div>
</div></div>

<!-- 여행 설정 모달 -->
<div class="modalBg" id="tripModalBg"><div class="modal">
  <h2>여행 설정</h2>
  <label>여행 이름</label><input type="text" id="tripName">
  <label>시작일 (Day 1)</label><input type="date" id="tripStart">
  <div class="row">
    <button class="btn" id="tripDelBtn" style="margin-right:auto;color:#ff8fa3">여행 삭제</button>
    <button class="btn" id="tripCancel">취소</button>
    <button class="btn primary" id="tripSave">저장</button>
  </div>
</div></div>

<!-- 여행 모드 -->
<div id="travel">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <button class="btn" id="travelClose">← 닫기</button>
    <select id="travelDay" style="flex:1"></select>
  </div>
  <h2 id="travelTitle"></h2>
  <div class="sub" id="travelSub"></div>
  <div class="list" id="travelList"></div>
</div>
<div id="toast"></div>

<script>
// ───────────────── 저장소 ─────────────────
const LS_KEY = 'tripcanvas_v1';
const PALETTE = ['#e63946','#f4862c','#e9b912','#2a9d3f','#2196d9','#8e44ad','#b5838d','#14b8a6','#f472b6','#a3e635'];
let store = null;

function seedSpain(){
  return {

      {title:'마드리드', drive:'', note:'⚽ 경기가 월요일이면 저녁 직관', spots:[
        {name:'왕궁 (Palacio Real)',lat:40.4179,lng:-3.7143,city:'마드리드',desc:'관람 2~3시간. 온라인 사전예약 권장 (patrimonionacional.es)',opt:false},
        {name:'프라도 미술관',lat:40.4138,lng:-3.6921,city:'마드리드',desc:'월~토 10-20 / 일 10-19. 폐관 2시간 전 무료(줄 김)',opt:false}]},

      {title:'말라가 · 코스타 델 솔', drive:'', note:'', spots:[

      {title:'그라나다 — 알함브라', drive:'', note:'예약 시간 엄수, 여권 지참', spots:[
        {name:'알함브라 궁전',lat:37.1761,lng:-3.5881,city:'그라나다',desc:'🚨 사전예매 필수 (tickets.alhambra-patronato.es). 나스르 궁전 입장시간 지정제. 반나절',opt:false},
        {name:'산 니콜라스 전망대',lat:37.1810,lng:-3.5927,city:'그라나다',desc:'알함브라+설산 뷰. 일몰 강추 🌇',opt:false}]},
      {title:'→ 마드리드 (2박)', drive:'🚗 그라나다 → 마드리드 · 420km · 약 4시간 15분', note:'오후 도착, 렌터카 반납', spots:[]},
      {title:'마드리드 자유일', drive:'', note:'산 미겔 시장, 레이나 소피아(게르니카), 쇼핑', spots:[]},
      {title:'출국', drive:'', note:'11:00 비행기 — 08:30 공항 도착 권장', spots:[
        {name:'바라하스 공항 (MAD)',lat:40.4720,lng:-3.5610,city:'마드리드',desc:'11:00 출국',opt:false}]}

  };
}
function load(){
  try{ store = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(!store || !store.trips || !store.trips.length){
    store = {trips:[seedSpain()], activeId:'spain2026'};
    save();
  }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
function trip(){ return store.trips.find(t=>t.id===store.activeId) || store.trips[0]; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function toast(msg, color){ const t=document.getElementById('toast'); t.textContent=msg; t.style.background=color||'#2a9d3f'; t.style.display='block'; setTimeout(()=>t.style.display='none',2200); }

// ───────────────── 지도 ─────────────────
const map = L.map('map').setView([40,-3.7],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'&copy; OSM &copy; CARTO',maxZoom:19}).addTo(map);
let activeDay = 0, markers = [], lines = [], pickMode = false;

function cityColors(){
  const m = {}; let i = 0;
  trip().days.forEach(d=>d.spots.forEach(s=>{ if(!(s.city in m)){ m[s.city]=PALETTE[i%PALETTE.length]; i++; } }));
  return m;
}
function mkIcon(color,label,opt){
  const size = opt?22:27;
  return L.divIcon({className:'',iconSize:[size,size],iconAnchor:[size/2,size/2],
    html:`<div class="num-icon" style="width:${size}px;height:${size}px;background:${color};${opt?'opacity:.75;':''}">${label??''}</div>`});
}
function dateOf(di){
  if(!trip().start) return '';
  const d = new Date(trip().start+'T00:00:00'); d.setDate(d.getDate()+di);
  return `${d.getMonth()+1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`;
}
function gmapsLink(s){ return `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}(${encodeURIComponent(s.name)})`; }

function render(){
  const t = trip(), colors = cityColors();
  // 마커·라인 정리
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  lines.forEach(l=>map.removeLayer(l)); lines=[];
  // 마커
  t.days.forEach((day,di)=>{
    if(activeDay && di+1!==activeDay) return;
    day.spots.forEach((s,si)=>{
      const c = colors[s.city]||'#888';
      const m = L.marker([s.lat,s.lng],{icon:mkIcon(c,si+1,s.opt)})
        .bindTooltip(s.name,{direction:'top',offset:[0,-12]})
        .bindPopup(`<h3>${s.name}</h3><span class="badge" style="background:${c}">Day ${di+1} · ${dateOf(di)}</span>`+
          `<div>${(s.desc||'').replace(/\n/g,'<br>')}</div>`+
          `<div style="margin-top:6px"><a href="${gmapsLink(s)}" target="_blank">Google 지도 ↗</a> &nbsp; `+
          `<a href="#" onclick="openSpotModal(${di},${si});return false;">✎ 편집</a></div>`);
      m.addTo(map); markers.push(m);
    });
    // 일자 내 동선
    if(day.spots.length>1){
      const c = colors[day.spots[0].city]||'#888';
      const l = L.polyline(day.spots.map(s=>[s.lat,s.lng]),{color:c,weight:3,opacity:activeDay?0.9:0.45});
      l.addTo(map); lines.push(l);
    }
  });
  // 일자 간 연결 (전체 보기)
  if(!activeDay){
    let prev = null;
    t.days.forEach(day=>{
      if(!day.spots.length) return;
      if(prev){
        const l = L.polyline([[prev.lat,prev.lng],[day.spots[0].lat,day.spots[0].lng]],{color:'#f6bd60',weight:2,dashArray:'7 6',opacity:.8});
        l.addTo(map); lines.push(l);
      }
      prev = day.spots[day.spots.length-1];
    });
  }
  renderSidebar(); renderFilter(); renderLegend();
  document.getElementById('tripSel').innerHTML = store.trips.map(x=>`<option value="${x.id}" ${x.id===store.activeId?'selected':''}>${x.name}</option>`).join('');
  save();
}
function fitAll(){
  const pts=[]; trip().days.forEach(d=>d.spots.forEach(s=>pts.push([s.lat,s.lng])));
  if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.2));
}
function renderFilter(){
  const bar = document.getElementById('filterbar'); bar.innerHTML='';
  const all = document.createElement('button'); all.className='chip'+(activeDay?'':' active'); all.textContent='전체';
  all.onclick=()=>{activeDay=0;render();fitAll();}; bar.appendChild(all);
  trip().days.forEach((d,i)=>{
    const b=document.createElement('button'); b.className='chip'+(activeDay===i+1?' active':''); b.textContent='D'+(i+1); b.title=d.title;
    b.onclick=()=>{activeDay=i+1;render();
      const pts=d.spots.map(s=>[s.lat,s.lng]);
      if(pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.3),{duration:.7,maxZoom:14});};
    bar.appendChild(b);
  });
  const colors = cityColors();
  const sep=document.createElement('span'); sep.style.cssText='width:1px;height:18px;background:#2a3457;margin:0 4px'; bar.appendChild(sep);
  Object.entries(colors).forEach(([city,c])=>{
    const b=document.createElement('button'); b.className='chip citychip'; b.style.setProperty('--c',c); b.textContent=city;
    b.onclick=()=>{
      const pts=[]; trip().days.forEach(d=>d.spots.forEach(s=>{if(s.city===city)pts.push([s.lat,s.lng])}));
      if(pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.4),{duration:.8,maxZoom:14});
    };
    bar.appendChild(b);
  });
}
function renderLegend(){
  const colors=cityColors();
  document.getElementById('legend').innerHTML='<b style="font-size:12px">도시</b><br>'+
    Object.entries(colors).map(([n,c])=>`<span class="dot" style="background:${c}"></span>${n}`).join('<br>')+
    '<br><span style="color:#f6bd60">- - -</span> 일자 간 이동';
}
function renderSidebar(){
  const sb=document.getElementById('sidebar'); sb.innerHTML='';
  const colors=cityColors();
  trip().days.forEach((day,di)=>{
    const c = day.spots.length? (colors[day.spots[0].city]||'#556') : '#556';
    const card=document.createElement('div'); card.className='dayCard'+(activeDay&&activeDay!==di+1?' dim':''); card.style.setProperty('--c',c);
    let spotsHtml='';
    day.spots.forEach((s,si)=>{
      spotsHtml+=`<div class="spot" style="--c:${colors[s.city]||'#888'}">
        <span class="nm" onclick="focusSpot(${di},${si})">${si+1}. ${s.name}${s.opt?' <span class=opt>(선택)</span>':''}</span>
        <span class="tools">
          <button class="iconb" onclick="moveSpot(${di},${si},-1)" title="위로">▲</button>
          <button class="iconb" onclick="moveSpot(${di},${si},1)" title="아래로">▼</button>
          <button class="iconb" onclick="openSpotModal(${di},${si})" title="편집">✎</button>
        </span></div>`;
    });
    card.innerHTML=`<div class="dayHead">
        <span>Day ${di+1} · ${day.title||''}</span>
        <span style="display:flex;align-items:center;gap:6px"><span class="date">${dateOf(di)}</span>
        <span class="tools"><button class="iconb" onclick="event.stopPropagation();openDayModal(${di})">✎</button></span></span>
      </div><div class="dayBody">
        ${day.drive?`<div class="drive">${day.drive}</div>`:''}
        ${spotsHtml}
        <button class="addSpot" onclick="openSpotModal(${di},-1)">＋ 명소 추가</button>
        ${day.note?`<div class="note">📝 ${day.note}</div>`:''}
      </div>`;
    card.querySelector('.dayHead').onclick=(e)=>{
      if(e.target.closest('.iconb'))return;
      activeDay=di+1;render();
      const pts=day.spots.map(s=>[s.lat,s.lng]);
      if(pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.3),{duration:.7,maxZoom:14});
    };
    sb.appendChild(card);
  });
  const add=document.createElement('button'); add.className='btn'; add.id='addDayBtn'; add.textContent='＋ 일자 추가';
  add.onclick=()=>{ trip().days.push({title:'',drive:'',note:'',spots:[]}); render(); openDayModal(trip().days.length-1); };
  sb.appendChild(add);
}
window.focusSpot=(di,si)=>{
  const s=trip().days[di].spots[si];
  if(activeDay && activeDay!==di+1){ activeDay=0; render(); }
  map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),13),{duration:.7});
  setTimeout(()=>{ markers.forEach(m=>{ const p=m.getLatLng(); if(Math.abs(p.lat-s.lat)<1e-9&&Math.abs(p.lng-s.lng)<1e-9) m.openPopup(); }); },750);
};
window.moveSpot=(di,si,dir)=>{
  const arr=trip().days[di].spots, ni=si+dir;
  if(ni<0||ni>=arr.length)return;
  [arr[si],arr[ni]]=[arr[ni],arr[si]]; render();
};

// ───────────────── 명소 모달 ─────────────────
let editing = null; // {di, si} si=-1이면 추가
window.openSpotModal=(di,si)=>{
  editing={di,si};
  const isNew = si<0;
  document.getElementById('spotModalTitle').textContent = isNew?'명소 추가':'명소 편집';
  document.getElementById('spotDelBtn').style.display = isNew?'none':'block';
  const s = isNew? {name:'',city:trip().days[di].spots[0]?.city||'',desc:'',opt:false,lat:'',lng:''} : trip().days[di].spots[si];
  document.getElementById('spotName').value=s.name;
  document.getElementById('spotCity').value=s.city;
  document.getElementById('spotDesc').value=s.desc||'';
  document.getElementById('spotOpt').checked=!!s.opt;
  document.getElementById('spotLat').value=s.lat; document.getElementById('spotLng').value=s.lng;
  document.getElementById('coordHint').textContent = s.lat?`좌표: ${(+s.lat).toFixed(4)}, ${(+s.lng).toFixed(4)}`:'좌표: 미지정 (검색 또는 지도 클릭)';
  document.getElementById('spotSearch').value=''; document.getElementById('searchRes').innerHTML='';
  const daySel=document.getElementById('spotDay');
  daySel.innerHTML=trip().days.map((d,i)=>`<option value="${i}" ${i===di?'selected':''}>Day ${i+1} · ${d.title||dateOf(i)}</option>`).join('');
  document.getElementById('spotModalBg').classList.add('show');
};
document.getElementById('spotCancel').onclick=()=>document.getElementById('spotModalBg').classList.remove('show');
document.getElementById('spotSave').onclick=()=>{
  const name=document.getElementById('spotName').value.trim();
  const lat=parseFloat(document.getElementById('spotLat').value), lng=parseFloat(document.getElementById('spotLng').value);
  if(!name){toast('이름을 입력하세요','#e63946');return;}
  if(isNaN(lat)||isNaN(lng)){toast('위치를 지정하세요 (검색 또는 지도 클릭)','#e63946');return;}
  const s={name,city:document.getElementById('spotCity').value.trim()||'기타',desc:document.getElementById('spotDesc').value.trim(),
    opt:document.getElementById('spotOpt').checked,lat,lng};
  const targetDay=parseInt(document.getElementById('spotDay').value);
  if(editing.si>=0){ trip().days[editing.di].spots.splice(editing.si,1); }
  trip().days[targetDay].spots.push(s);
  document.getElementById('spotModalBg').classList.remove('show');
  render(); toast('저장됨');
};
document.getElementById('spotDelBtn').onclick=()=>{
  trip().days[editing.di].spots.splice(editing.si,1);
  document.getElementById('spotModalBg').classList.remove('show');
  render(); toast('삭제됨','#8892b0');
};
// 장소 검색 (Nominatim)
async function doSearch(){
  const q=document.getElementById('spotSearch').value.trim(); if(!q)return;
  const res=document.getElementById('searchRes'); res.innerHTML='<div>검색 중…</div>';
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}`,{headers:{'Accept-Language':'ko,en'}});
    const js=await r.json();
    res.innerHTML = js.length? '' : '<div>결과 없음</div>';
    js.forEach(it=>{
      const d=document.createElement('div'); d.textContent=it.display_name;
      d.onclick=()=>{
        document.getElementById('spotLat').value=it.lat; document.getElementById('spotLng').value=it.lon;
        if(!document.getElementById('spotName').value) document.getElementById('spotName').value=it.display_name.split(',')[0];
        document.getElementById('coordHint').textContent=`좌표: ${(+it.lat).toFixed(4)}, ${(+it.lon).toFixed(4)} ✓`;
        res.innerHTML='';
      };
      res.appendChild(d);
    });
  }catch(e){ res.innerHTML='<div>검색 실패 — 지도 클릭으로 지정해주세요</div>'; }
}
document.getElementById('spotSearchBtn').onclick=doSearch;
document.getElementById('spotSearch').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
// 지도 클릭 지정
document.getElementById('pickOnMap').onclick=()=>{
  pickMode=true;
  document.getElementById('spotModalBg').classList.remove('show');
  document.getElementById('pickBanner').style.display='block';
};
map.on('click',e=>{
  if(!pickMode)return;
  pickMode=false; document.getElementById('pickBanner').style.display='none';
  document.getElementById('spotLat').value=e.latlng.lat; document.getElementById('spotLng').value=e.latlng.lng;
  document.getElementById('coordHint').textContent=`좌표: ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)} ✓`;
  document.getElementById('spotModalBg').classList.add('show');
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&pickMode){pickMode=false;document.getElementById('pickBanner').style.display='none';document.getElementById('spotModalBg').classList.add('show');} });

// ───────────────── 일자 모달 ─────────────────
let editingDay=null;
window.openDayModal=(di)=>{
  editingDay=di;
  const d=trip().days[di];
  document.getElementById('dayModalTitle').textContent=`Day ${di+1} 편집 · ${dateOf(di)}`;
  document.getElementById('dayTitle').value=d.title||'';
  document.getElementById('dayDrive').value=d.drive||'';
  document.getElementById('dayNote').value=d.note||'';
  document.getElementById('dayModalBg').classList.add('show');
};
document.getElementById('dayCancel').onclick=()=>document.getElementById('dayModalBg').classList.remove('show');
document.getElementById('daySave').onclick=()=>{
  const d=trip().days[editingDay];
  d.title=document.getElementById('dayTitle').value.trim();
  d.drive=document.getElementById('dayDrive').value.trim();
  d.note=document.getElementById('dayNote').value.trim();
  document.getElementById('dayModalBg').classList.remove('show'); render(); toast('저장됨');
};
document.getElementById('dayDelBtn').onclick=()=>{
  if(trip().days[editingDay].spots.length && !confirm('이 일자의 명소도 함께 삭제됩니다. 계속할까요?'))return;
  trip().days.splice(editingDay,1); activeDay=0;
  document.getElementById('dayModalBg').classList.remove('show'); render(); toast('일자 삭제됨','#8892b0');
};

// ───────────────── 여행 관리 ─────────────────
document.getElementById('tripSel').onchange=e=>{ store.activeId=e.target.value; activeDay=0; render(); fitAll(); };
document.getElementById('newTripBtn').onclick=()=>{
  const name=prompt('새 여행 이름은?','새 여행'); if(name===null)return;
  const t={id:uid(),name:name||'새 여행',start:new Date().toISOString().slice(0,10),days:[{title:'',drive:'',note:'',spots:[]}]};
  store.trips.push(t); store.activeId=t.id; activeDay=0; render();
  document.getElementById('tripModalBg').classList.add('show');
  document.getElementById('tripName').value=t.name; document.getElementById('tripStart').value=t.start;
};
document.getElementById('tripEditBtn').onclick=()=>{
  document.getElementById('tripName').value=trip().name;
  document.getElementById('tripStart').value=trip().start||'';
  document.getElementById('tripModalBg').classList.add('show');
};
document.getElementById('tripCancel').onclick=()=>document.getElementById('tripModalBg').classList.remove('show');
document.getElementById('tripSave').onclick=()=>{
  trip().name=document.getElementById('tripName').value.trim()||'이름 없는 여행';
  trip().start=document.getElementById('tripStart').value;
  document.getElementById('tripModalBg').classList.remove('show'); render(); toast('저장됨');
};
document.getElementById('tripDelBtn').onclick=()=>{
  if(!confirm(`"${trip().name}" 여행을 삭제할까요?`))return;
  store.trips=store.trips.filter(t=>t.id!==store.activeId);
  if(!store.trips.length){ store.trips=[{id:uid(),name:'새 여행',start:new Date().toISOString().slice(0,10),days:[{title:'',drive:'',note:'',spots:[]}]}]; }
  store.activeId=store.trips[0].id; activeDay=0;
  document.getElementById('tripModalBg').classList.remove('show'); render(); fitAll();
};

// ───────────────── 내보내기/가져오기/공유 ─────────────────
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(trip(),null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=trip().name.replace(/\s+/g,'_')+'.json'; a.click();
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const t=JSON.parse(rd.result);
      if(!t.days) throw 0;
      t.id=uid(); store.trips.push(t); store.activeId=t.id; activeDay=0; render(); fitAll(); toast('가져오기 완료');
    }catch(err){ toast('잘못된 파일입니다','#e63946'); }
  };
  rd.readAsText(f); e.target.value='';
};
document.getElementById('shareBtn').onclick=()=>{
  const data=LZString.compressToEncodedURIComponent(JSON.stringify(trip()));
  const url=location.origin+location.pathname+'#t='+data;
  navigator.clipboard.writeText(url).then(()=>toast('공유 링크가 복사되었습니다 (읽는 쪽에서 자동 저장됨)'))
    .catch(()=>prompt('이 링크를 복사하세요',url));
};
// 공유 링크로 열었을 때
(function(){
  load();
  if(location.hash.startsWith('#t=')){
    try{
      const t=JSON.parse(LZString.decompressFromEncodedURIComponent(location.hash.slice(3)));
      if(t&&t.days){
        t.id=uid(); t.name=(t.name||'공유된 여행');
        store.trips.push(t); store.activeId=t.id; save();
        history.replaceState(null,'',location.pathname);
        setTimeout(()=>toast('공유된 여행을 불러왔습니다'),400);
      }
    }catch(e){}
  }
})();

// ───────────────── 여행 모드 ─────────────────
document.getElementById('travelBtn').onclick=()=>{
  const t=trip(); let di=0;
  if(t.start){
    const diff=Math.floor((new Date().setHours(0,0,0,0)-new Date(t.start+'T00:00:00'))/86400000);
    di=Math.min(Math.max(diff,0),t.days.length-1);
  }
  const sel=document.getElementById('travelDay');
  sel.innerHTML=t.days.map((d,i)=>`<option value="${i}" ${i===di?'selected':''}>Day ${i+1} · ${dateOf(i)} · ${d.title||''}</option>`).join('');
  sel.onchange=()=>renderTravel(parseInt(sel.value));
  renderTravel(di);
  document.getElementById('travel').classList.add('show');
};
document.getElementById('travelClose').onclick=()=>document.getElementById('travel').classList.remove('show');
function renderTravel(di){
  const t=trip(), d=t.days[di], colors=cityColors();
  document.getElementById('travelTitle').textContent=`Day ${di+1} · ${d.title||''}`;
  document.getElementById('travelSub').textContent=[dateOf(di),d.drive,d.note].filter(Boolean).join('  ·  ');
  const list=document.getElementById('travelList'); list.innerHTML='';
  if(!d.spots.length){ list.innerHTML='<div style="color:#9aa5c4;font-size:13px;padding:20px 4px">이 날은 등록된 명소가 없습니다 — 이동일이거나 자유 일정</div>'; return; }
  d.spots.forEach((s,si)=>{
    const div=document.createElement('div'); div.className='tSpot'; div.style.setProperty('--c',colors[s.city]||'#888');
    div.innerHTML=`<div class="n">${si+1}. ${s.name}${s.opt?' <span style="font-size:11px;color:#8892b0">(선택)</span>':''}</div>`+
      `<div class="d">${s.desc||''}</div>`+
      `<a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=walking" target="_blank">🧭 여기로 길찾기</a>`;
    list.appendChild(div);
  });
}

// ───────────────── PWA ─────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
// 오프라인 준비: 일정 주변 지도 타일 미리 캐시
document.getElementById('offlineBtn').onclick=async()=>{
  if(!navigator.serviceWorker || !navigator.serviceWorker.controller){
    toast('먼저 배포된 주소(https)에서 열어야 오프라인 기능이 작동합니다','#e63946'); return;
  }
  const spots=[]; trip().days.forEach(d=>d.spots.forEach(s=>spots.push(s)));
  if(!spots.length){toast('명소가 없습니다','#e63946');return;}
  const r = (window.devicePixelRatio>1)?'@2x':'';
  const subs=['a','b','c','d'];
  const urls=new Set();
  function tileXY(lat,lng,z){
    const n=Math.pow(2,z);
    const x=Math.floor((lng+180)/360*n);
    const la=lat*Math.PI/180;
    const y=Math.floor((1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n);
    return [x,y];
  }
  spots.forEach(s=>{
    [11,13,15].forEach(z=>{
      const [cx,cy]=tileXY(s.lat,s.lng,z);
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
        urls.add(`${z}/${cx+dx}/${cy+dy}`);
      }
    });
  });
  const list=[...urls].slice(0,700);
  toast(`오프라인 지도 준비 중… (타일 ${list.length}개)`,'#1d6fd6');
  let done=0, i=0;
  await Promise.all(Array.from({length:6},async()=>{
    while(i<list.length){
      const t=list[i++];
      try{ await fetch(`https://${subs[done%4]}.basemaps.cartocdn.com/rastertiles/voyager/${t}${r}.png`); }catch(e){}
      done++;
    }
  }));
  toast(`완료! 방문 지역 지도가 저장되었습니다 (${done}개)`);
};

// 시작
render(); fitAll();
</script>
</body>
</html>
