name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: npm run check:syntax
      - name: Service worker / asset version sync
        run: npm run check:version
      - name: Lint focused modules
        run: npm run lint
      - name: Secret pattern check
        run: npm run security:scan
      - name: Type check (lib + sync + routing)
        run: npm run check:types
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high

  next:
    name: Next workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check:types
      - name: Domain parity tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Core flows + PWA
        run: npm run test:e2e
