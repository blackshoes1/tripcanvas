name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check app.js && node --check lib.js && node --check sw.js
      - name: Type check (lib.js, JSDoc)
        run: npx -y -p typescript@5.6.3 tsc -p jsconfig.json
      - name: Unit tests
        run: node --test
