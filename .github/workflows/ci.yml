name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: npm run check:syntax
      - name: Service worker / asset version sync
        run: npm run check:version
      - name: Lint focused modules
        run: npm run lint
      - name: Secret pattern check
        run: npm run security:scan
      - name: Type check (lib + sync + routing)
        run: npm run check:types
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      # 함께하기 RLS — 러너에 깔린 PostgreSQL로 마이그레이션을 실제 적용하고 사용자 격리를 DB가 판정한다(§94).
      # 로컬에서 바이너리가 없으면 테스트는 skip되지만, CI에서는 반드시 돌아야 한다.
      - name: RLS on real PostgreSQL
        run: |
          scripts/pg-local.sh start
          eval "$(scripts/pg-local.sh env)"
          npm run test:rls 2>&1 | tee rls.log
          grep -q "# skipped 0" rls.log
      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high

  next:
    name: Next workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check:types
      - name: Domain parity tests
        run: npm test
      - name: Build
        run: npm run build
      # 실시간 사이드카는 Next 번들과 따로 컴파일된다 — 여기서 안 돌리면 조용히 깨진 채로 남는다
      - name: Build realtime sidecar
        run: npm run realtime:build

  e2e:
    name: E2E
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Core flows + PWA
        run: npm run test:e2e
