name: CI
on:
  pull_request:
  # main 푸시의 게이트는 release.yml이 이 워크플로를 **불러서** 돌린다(두 번 돌지 않게 push 트리거는 없다).
  workflow_call:
# ⚠️ shell을 적지 않은 run 스텝은 `bash -e {0}`로 돈다 — **pipefail이 꺼져 있다.** 그러면
#    `npm audit … | tee audit.log`의 종료 코드는 tee의 0이라, 취약점이 있어도 감사가 초록이고
#    RLS 테스트가 실패해도 다음 줄로 넘어간다(2026-10-02 리뷰에서 드러났다). `shell: bash`는
#    `bash --noprofile --norc -eo pipefail {0}`이다. verify-all.sh는 같은 단계를 `bash -o pipefail`로 돌린다.
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20은 2026-04-30에 지원이 끝났다. next 잡·운영 이미지(node:22-alpine)와 같은 22로 돈다
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: npm run check:syntax
      - name: Service worker / asset version sync
        run: npm run check:version
      - name: Lint focused modules
        run: npm run lint
      - name: Secret pattern check
        run: npm run security:scan
      # main 머지가 운영 DB에 자동 적용된다 — 파괴적 마이그레이션은 여기서 멈춘다(docs/migration-policy.md)
      - name: Migration backward compatibility
        run: npm run check:migrations
      - name: Type check (lib + sync + routing)
        run: npm run check:types
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      # 함께하기 RLS — 러너에 깔린 PostgreSQL로 마이그레이션을 실제 적용하고 사용자 격리를 DB가 판정한다(§94).
      # 로컬에서 바이너리가 없으면 테스트는 skip되지만, CI에서는 반드시 돌아야 한다.
      - name: RLS on real PostgreSQL
        run: |
          scripts/pg-local.sh start
          eval "$(scripts/pg-local.sh env)"
          npm run test:rls 2>&1 | tee rls.log
          grep -q "# skipped 0" rls.log
      # 복구해 본 백업만 백업이다 — 실제 pg_dump → pg_restore → 마이그레이션 → 전수 대조(합성 데이터). verify-all.sh와 같은 단계
      - name: Install next workspace (drizzle-kit for the rehearsal)
        run: npm --prefix next ci --no-audit --no-fund
      - name: Restore rehearsal on real PostgreSQL
        run: npm run rehearse:restore
      # ⚠️ 취약점이 아니라 **레지스트리가 흔들려서** 실패하는 일이 있다(2026-09-06 run #…):
      #    `audit endpoint returned an error` · 400 `Invalid package tree`.
      #    npm이 이 엔드포인트를 은퇴시키는 중이라 앞으로도 난다.
      #    그래서 **그 오류일 때만** 다시 시도한다 — 진짜 취약점은 그대로 실패해야 한다.
      - name: Dependency audit (high severity)
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high 2>&1 | tee audit.log; then exit 0; fi
            grep -q "audit endpoint returned an error" audit.log || {
              echo "취약점으로 실패했다 — 재시도하지 않는다"; exit 1; }
            echo "레지스트리 오류로 실패($attempt/3) — 15초 뒤 다시 시도한다"
            sleep 15
          done
          echo "레지스트리가 세 번 다 흔들렸다. 코드 문제가 아니다 — docs/ci.md 참고"
          exit 1

  next:
    name: Next workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check:types
      - name: Domain parity tests
        run: npm test

      # ⚠️ 파리티 테스트는 픽스처를 **읽지 않고 덮어쓴다.** 커밋 안 된 계약 변경이 있으면 러너가 제 손으로
      #    다시 써서 초록이 되고, `ios/**` 경로가 안 걸려 iOS 워크플로도 돌지 않는다 — Swift는 검사되지
      #    않은 채 남는다. 그래서 "다시 쓴 결과가 커밋된 것과 같은가"를 여기서 본다.
      - name: Parity fixtures are committed
        working-directory: .
        run: |
          dirty=$(git status --porcelain -- ios/TripCanvasTests/Fixtures)
          if [ -n "$dirty" ]; then
            echo "::error::파리티 픽스처가 테스트로 다시 쓰여 커밋된 것과 다르다 — 계약 변경분을 커밋해야 iOS가 검사된다"
            echo "$dirty"
            git --no-pager diff -- ios/TripCanvasTests/Fixtures
            exit 1
          fi
          echo "파리티 픽스처가 커밋된 것과 같다"
      - name: Build
        run: npm run build
      # 독립 실행 도구(실시간 사이드카 · 이관 CLI)는 Next 번들과 따로 컴파일된다 — 여기서 안 돌리면 조용히 깨진 채로 남는다
      - name: Build standalone tools (realtime · migration)
        run: npm run tools:build
      # 운영 API 이미지에 실리는 것은 이 워크스페이스의 런타임 의존성이다 — Quality 잡의 감사는 루트만 본다.
      # 재시도 규칙은 Quality 잡과 같다: 레지스트리 오류일 때만 다시 묻고, 진짜 취약점은 그대로 실패한다.
      - name: Dependency audit (runtime, high severity)
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log; then exit 0; fi
            grep -q "audit endpoint returned an error" audit.log || {
              echo "취약점으로 실패했다 — 재시도하지 않는다"; exit 1; }
            echo "레지스트리 오류로 실패($attempt/3) — 15초 뒤 다시 시도한다"
            sleep 15
          done
          echo "레지스트리가 세 번 다 흔들렸다. 코드 문제가 아니다 — docs/ci.md 참고"
          exit 1
      - name: Install browser test dependencies
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Next web API connection flows
        run: npm --prefix .. run test:e2e:next

  e2e:
    name: E2E
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Core flows + PWA
        run: npm run test:e2e

  # 운영 이미지가 빌드되는지 **머지 전에** 본다 — Dockerfile이 깨지면 자동 배포가 통째로 멈춘다.
  # 푸시하지 않는다(release.yml만 GHCR에 올린다). release가 불렀을 때는 건너뛴다 — 거기서 진짜로 빌드한다.
  images:
    name: Docker image build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: api 이미지(runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: next/Dockerfile
          target: runtime
          push: false
          build-args: TC_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: tools 이미지(migrate · realtime 공용)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: next/Dockerfile
          target: tools
          push: false
          load: true
          tags: tripcanvas-tools:pr
          build-args: TC_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max
      # 실시간 사이드카는 Funnel로 인터넷에 열려 있다 — root로 돌지 않는지, 그 사용자로 migrate의 명령(`npx drizzle-kit`)이
      # 뜨는지 본다(DB 없이 버전만). 비루트로 바꾼 뒤 NAS에서 처음 알게 되면 그때는 배포가 이미 멈춘 뒤다.
      - name: tools 이미지가 root가 아니고 migrate 명령이 뜬다
        run: |
          uid=$(docker run --rm --entrypoint id tripcanvas-tools:pr -u)
          echo "tools 이미지 uid=$uid"
          [ "$uid" != 0 ] || { echo "::error::tools 이미지가 root로 돈다"; exit 1; }
          docker run --rm tripcanvas-tools:pr npx drizzle-kit --version
