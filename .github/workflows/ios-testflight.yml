# TestFlight 업로드 — 이게 돌면 **Xcode를 여는 일이 없어진다.** 눌러서 올리고 폰에서 받는다.
#
# 서명 자산(인증서·프로비저닝 프로파일)을 저장소에 넣지 않는다. App Store Connect API 키만 주면
# `-allowProvisioningUpdates`가 필요한 것을 알아서 만들고 내려받는다 — .p12를 주고받을 일이 없다.
#
# ── 처음 한 번만: 저장소 Settings → Secrets and variables → Actions 에 네 개를 넣는다 ──
#   APPSTORE_ISSUER_ID    App Store Connect → 사용자 및 액세스 → 통합 → App Store Connect API 의 Issuer ID
#   APPSTORE_KEY_ID       같은 화면에서 키를 만들면 나오는 Key ID (역할: App Manager)
#   APPSTORE_PRIVATE_KEY  그때 딱 한 번 받는 .p8 파일 내용 전체 (BEGIN 줄부터 END 줄까지, 줄바꿈 포함)
#   APPLE_TEAM_ID         developer.apple.com → Membership 의 Team ID (10자리)
#
#   그리고 App Store Connect에 앱 레코드가 있어야 한다 (My Apps → + → New App,
#   Bundle ID는 com.fromj.trip).
#
# 빌드 번호는 실행 번호를 쓴다 — 같은 번호는 두 번 못 올리는데, 손으로 올리면 반드시 잊는다.
name: iOS TestFlight

on:
  workflow_dispatch:          # 필요할 때 눌러서 올린다 (Actions 탭 → 이 워크플로 → Run workflow)
    inputs:
      notes:
        description: '테스터에게 보일 변경 사항'
        required: false
        default: ''

jobs:
  upload:
    name: Archive + upload
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 비밀값이 없으면 여기서 **이유를 말하고 멈춘다.** 서명 단계까지 갔다가
      # 알아보기 힘든 오류로 죽는 것보다 낫다.
      - name: Check secrets
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          P8: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MISSING=""
          [ -n "$ISSUER" ] || MISSING="$MISSING APPSTORE_ISSUER_ID"
          [ -n "$KEY_ID" ] || MISSING="$MISSING APPSTORE_KEY_ID"
          [ -n "$P8" ]     || MISSING="$MISSING APPSTORE_PRIVATE_KEY"
          [ -n "$TEAM" ]   || MISSING="$MISSING APPLE_TEAM_ID"
          if [ -n "$MISSING" ]; then
            echo "다음 비밀값이 없다:$MISSING"
            echo "이 파일 맨 위 주석에 넣는 방법이 적혀 있다."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # xcodebuild가 읽을 수 있게 파일로 둔다. 러너는 실행마다 폐기되지만
      # 그래도 작업이 끝나면 지운다.
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.APPSTORE_PRIVATE_KEY }}" \
            > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          chmod 600 ~/private_keys/*.p8

      # ⚠️ archive에서 자동 서명을 켜면 Xcode가 **개발용(App Development)** 프로파일을 만들려 하고,
      # 그건 **등록된 기기를 요구한다** — 새 팀에는 기기가 없어 "your team has no devices"로 죽는다.
      # App Store 배포용 프로파일은 기기가 필요 없다. 그래서 archive는 서명 없이 만들고
      # 서명은 export에서 배포용으로 한 번만 한다(CI에서 쓰는 표준 순서).
      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project TripCanvas.xcodeproj \
            -scheme TripCanvas \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TripCanvas.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # destination=upload 로 두면 export와 업로드가 한 번에 끝난다.
      # 서명은 여기서 일어난다 — method: app-store-connect 라서 **배포용** 프로파일을 받는다
      # (기기 등록이 필요 없는 쪽).
      - name: Export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TripCanvas.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys

      - name: Summary
        if: success()
        run: |
          {
            echo "### TestFlight 업로드 완료"
            echo ""
            echo "- 빌드 번호: \`${{ github.run_number }}\`"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo "- 변경 사항: ${{ github.event.inputs.notes || '(없음)' }}"
            echo ""
            echo "App Store Connect가 처리하는 데 보통 5~15분 걸린다. 처리가 끝나면"
            echo "폰의 TestFlight 앱에 뜬다. 첫 업로드라면 내부 테스터에 자기 계정을 추가해야 보인다."
          } >> "$GITHUB_STEP_SUMMARY"
