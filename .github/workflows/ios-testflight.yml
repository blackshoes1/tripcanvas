# TestFlight 업로드 — 이게 돌면 **Xcode를 여는 일이 없어진다.** 눌러서 올리고 폰에서 받는다.
#
# 서명 자산(인증서·프로비저닝 프로파일)을 저장소에 넣지 않는다. App Store Connect API 키만 주면
# `-allowProvisioningUpdates`가 필요한 것을 알아서 만들고 내려받는다 — .p12를 주고받을 일이 없다.
#
# ── 처음 한 번만: 저장소 Settings → Secrets and variables → Actions 에 네 개를 넣는다 ──
#   APPSTORE_ISSUER_ID    App Store Connect → 사용자 및 액세스 → 통합 → App Store Connect API 의 Issuer ID
#   APPSTORE_KEY_ID       같은 화면에서 키를 만들면 나오는 Key ID
#                         ⚠️ 역할은 **Admin** 이어야 한다. -allowProvisioningUpdates 가 인증서·프로파일을
#                         만들려면 Certificates, Identifiers & Profiles 접근이 필요한데 App Manager 에는
#                         그 권한이 없다 — 'Cloud signing permission error' 로 죽는다.
#   APPSTORE_PRIVATE_KEY  그때 딱 한 번 받는 .p8 파일 내용 전체 (BEGIN 줄부터 END 줄까지, 줄바꿈 포함)
#   APPLE_TEAM_ID         developer.apple.com → Membership 의 Team ID (10자리)
#
#   그리고 App Store Connect에 앱 레코드가 있어야 한다 (My Apps → + → New App,
#   Bundle ID는 com.fromj.trip).
#
# 빌드 번호는 실행 번호를 쓴다 — 같은 번호는 두 번 못 올리는데, 손으로 올리면 반드시 잊는다.
name: iOS TestFlight

on:
  workflow_dispatch:          # 필요할 때 눌러서 올린다 (Actions 탭 → 이 워크플로 → Run workflow)
    inputs:
      notes:
        description: '테스터에게 보일 변경 사항'
        required: false
        default: ''

jobs:
  upload:
    name: Archive + upload
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 비밀값이 없으면 여기서 **이유를 말하고 멈춘다.** 서명 단계까지 갔다가
      # 알아보기 힘든 오류로 죽는 것보다 낫다.
      - name: Check secrets
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          P8: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          MISSING=""
          [ -n "$ISSUER" ] || MISSING="$MISSING APPSTORE_ISSUER_ID"
          [ -n "$KEY_ID" ] || MISSING="$MISSING APPSTORE_KEY_ID"
          [ -n "$P8" ]     || MISSING="$MISSING APPSTORE_PRIVATE_KEY"
          [ -n "$TEAM" ]   || MISSING="$MISSING APPLE_TEAM_ID"
          if [ -n "$MISSING" ]; then
            echo "다음 비밀값이 없다:$MISSING"
            echo "이 파일 맨 위 주석에 넣는 방법이 적혀 있다."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # xcodebuild가 읽을 수 있게 파일로 둔다. 러너는 실행마다 폐기되지만
      # 그래도 작업이 끝나면 지운다.
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.APPSTORE_PRIVATE_KEY }}" \
            > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          chmod 600 ~/private_keys/*.p8

      # ⚠️ archive에서 자동 서명을 켜면 Xcode가 **개발용(App Development)** 프로파일을 만들려 하고,
      # 그건 **등록된 기기를 요구한다** — 새 팀에는 기기가 없어 "your team has no devices"로 죽는다.
      # App Store 배포용 프로파일은 기기가 필요 없다. 그래서 archive는 서명 없이 만들고
      # 서명은 export에서 배포용으로 한 번만 한다(CI에서 쓰는 표준 순서).
      - name: Archive (unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project TripCanvas.xcodeproj \
            -scheme TripCanvas \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TripCanvas.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # destination=upload 로 두면 export와 업로드가 한 번에 끝난다.
      # 서명은 여기서 일어난다 — method: app-store-connect 라서 **배포용** 프로파일을 받는다
      # (기기 등록이 필요 없는 쪽).
      - name: Export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TripCanvas.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}

      # 이 실패는 Apple 메시지("No profiles ... were found")가 엉뚱한 곳을 가리킨다 —
      # 번들 ID나 앱 레코드 문제로 읽히지만 실제로는 **키 권한**이다. 로그를 파고들지 않아도
      # 되게 요약에 바로 적는다. run #2가 이걸로 죽었다.
      - name: Why the upload failed
        if: failure()
        run: |
          {
            echo "### 업로드 실패 — 먼저 API 키 역할부터 볼 것"
            echo ""
            echo "로그에 \`Cloud signing permission error\` 또는"
            echo "\`No profiles for 'com.fromj.trip...' were found\` 가 있으면"
            echo "**App Store Connect API 키 역할이 \`Admin\` 이 아니다.**"
            echo ""
            echo "\`-allowProvisioningUpdates\` 가 프로비저닝 프로파일을 직접 만드는데,"
            echo "그건 **Certificates, Identifiers & Profiles** 접근을 요구한다."
            echo "\`App Manager\` 에는 그 권한이 없다."
            echo ""
            echo "키의 역할은 나중에 바꿀 수 없다 → **Admin 으로 키를 새로 만들어**"
            echo "\`APPSTORE_KEY_ID\` 와 \`APPSTORE_PRIVATE_KEY\` 를 교체한다 (Issuer ID는 그대로)."
            echo ""
            echo "그 밖의 원인은 \`docs/ios-device-setup.md\` 의 문제 해결 절에 정리돼 있다."
          } >> "$GITHUB_STEP_SUMMARY"

      # 바이너리만 올리면 폰의 TestFlight에서 **뭐가 바뀐 빌드인지 알 수 없다.**
      # `notes`가 여기까지 와야 의미가 있다 — 2026-09-06까지는 요약에만 찍히고 버려졌다.
      # ⚠️ 실패해도 업로드를 되돌리지 않는다(빌드는 이미 산다) — continue-on-error.
      - name: What to Test 채우기
        if: success() && github.event.inputs.notes != ''
        continue-on-error: true
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          TC_BUILD_NUMBER: ${{ github.run_number }}
          TC_WHATS_NEW: ${{ github.event.inputs.notes }}
        # ⚠️ 경로를 env에 적지 않는다 — YAML의 env는 셸이 아니라 `~`가 확장되지 않는다.
        # (2026-09-06 run #10이 `'~/private_keys/...'`를 그대로 열려다 ENOENT로 죽었다)
        run: |
          export APPSTORE_PRIVATE_KEY_PATH="$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          node scripts/testflight-notes.js

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys

      - name: Summary
        if: success()
        run: |
          {
            echo "### TestFlight 업로드 완료"
            echo ""
            echo "- 빌드 번호: \`${{ github.run_number }}\`"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo "- 변경 사항: ${{ github.event.inputs.notes || '(없음)' }}"
            echo ""
            echo "App Store Connect가 처리하는 데 보통 5~15분 걸린다. 처리가 끝나면"
            echo "폰의 TestFlight 앱에 뜬다. 첫 업로드라면 내부 테스터에 자기 계정을 추가해야 보인다."
          } >> "$GITHUB_STEP_SUMMARY"
