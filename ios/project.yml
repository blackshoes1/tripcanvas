# XcodeGen 명세 — project.pbxproj를 손으로 쓰면 깨지기 쉬워 여기서 생성한다.
#   brew install xcodegen && cd ios && xcodegen generate && open TripCanvas.xcodeproj
#
# 공유 코드(TripCanvasShared/ + Contract.swift)는 프레임워크로 만들지 않고 앱과 위젯 확장에
# **소스로 함께 넣는다.** 프레임워크로 빼면 같은 타입이 두 모듈에 따로 생겨 경계에서 어긋난다.
# 두 타깃은 App Group의 UserDefaults만 주고받으므로 각자 디코딩하면 충분하다.
name: TripCanvas
options:
  bundleIdPrefix: com.fromj
  deploymentTarget:
    iOS: "17.0"          # @Observable(Observation) · ActivityKit Live Activity
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""           # 서명은 각자 로컬에서 채운다
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # ⚠️ 확장·Watch의 버전이 본체와 다르면 App Store Connect가 업로드를 거부한다.
    # 그래서 여기(프로젝트 base)에 한 번만 두고 모든 타깃이 물려받게 한다.
    MARKETING_VERSION: "0.1.0"     # 사람이 보는 버전 (TestFlight에 표시)
    CURRENT_PROJECT_VERSION: "1"   # 빌드 번호 — 업로드마다 반드시 올린다(CI는 run number를 넣는다)
  configs:
    # ⚠️ TestFlight·App Store 빌드는 **production** APNs를 쓴다. development로 올리면
    # 기기가 샌드박스에 등록돼 실제 푸시가 조용히 안 온다 — 원인 찾기 어려운 부류다.
    # entitlements에서 $(APS_ENVIRONMENT)로 받아 구성에 따라 갈린다.
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

# 지도 SDK — 처음 들어온 외부 의존성이다. 둘 다 바이너리 xcframework라 빌드가 아니라 링크만 한다.
#   구글: iOS 16+, 해외 지도 · 카카오: 국내 지도(POI 탭 신원을 주지 않는 제약은 웹과 같다)
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "11.1.0"
  KakaoMapsSDK:
    url: https://github.com/kakao-mapsSDK/KakaoMapsSDK-SPM
    from: "2.12.19"

targets:
  TripCanvas:
    type: application
    platform: iOS
    sources:
      - path: TripCanvas
      - path: TripCanvasShared
    info:
      path: TripCanvas/Info.plist
      properties:
        CFBundleDisplayName: From J
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        # 첫 실행에 권한을 몰아 요청하지 않는다 — 쓸모를 설명할 수 있을 때 묻는다(§6·§42).
        NSLocationWhenInUseUsageDescription: 다음 장소까지 걸리는 시간과 나서기 좋은 시간을 알려드리기 위해 사용합니다. 위치는 그때 계산에만 쓰고 저장하지 않습니다.
        # 운영 API는 NAS다(2026-09-04 전환) — Tailscale Funnel이 ts.net 이름에 HTTPS를 붙인다.
        # 로컬 서버로 붙일 때만 이 값을 바꾼다(그때는 http라 NSAppTransportSecurity 예외가 필요하다).
        TCApiBaseURL: "https://bokbok9.tail8b977f.ts.net"
        # 지도 SDK 네이티브 키 — 번들 ID 제한(com.fromj.trip). 무료 스펙에서 번들 ID를 바꿨다면 콘솔의 제한에 그 값도 넣는다.
        TCGoogleMapsKey: "AIzaSyC5b_lS9bW-qGFnL9KQ0Kn8SBr0a0VodIg"
        TCKakaoNativeKey: "fd08ca0a759ed5b4f1240887ed814957"
        TCSupabaseURL: ""
        TCSupabaseAnonKey: ""
    dependencies:
      - target: TripCanvasWidgets
      - target: TripCanvasShare
      - target: TripCanvasWatch
      - package: GoogleMaps
        product: GoogleMaps
      - package: KakaoMapsSDK
        product: KakaoMapsSDK-SPM
    entitlements:
      path: TripCanvas/TripCanvas.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fromj.trip
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fromj.trip
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # 위젯 + Live Activity. 네트워크도 인증도 없다 — 앱이 App Group에 써 둔 압축본만 읽는다(§28).
  TripCanvasWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TripCanvasWidgets
      - path: TripCanvasShared
      - path: TripCanvas/Core/Models/Contract.swift
    info:
      path: TripCanvasWidgets/Info.plist
      properties:
        CFBundleDisplayName: From J
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TripCanvasWidgets/TripCanvasWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fromj.trip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fromj.trip.widgets
        TARGETED_DEVICE_FAMILY: "1"

  # 공유받은 것을 그대로 큐에 넣고 바로 닫는다. 파싱·저장은 앱이 한다(§55).
  TripCanvasShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TripCanvasShare
      - path: TripCanvasShared
      - path: TripCanvas/Core/Models/Contract.swift
    info:
      path: TripCanvasShare/Info.plist
      properties:
        CFBundleDisplayName: From J
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: TripCanvasShare/TripCanvasShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fromj.trip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fromj.trip.share
        TARGETED_DEVICE_FAMILY: "1"

  # iPhone이 App Group에 써 둔 압축본만 읽는다. 도메인을 다시 구현하지 않는다(§36).
  TripCanvasWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TripCanvasWatch
      - path: TripCanvasShared
      - path: TripCanvas/Core/Models/Contract.swift
    info:
      path: TripCanvasWatch/Info.plist
      properties:
        CFBundleDisplayName: From J
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.fromj.trip
    entitlements:
      path: TripCanvasWatch/TripCanvasWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fromj.trip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fromj.trip.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TripCanvasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TripCanvasTests
    dependencies:
      - target: TripCanvas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fromj.trip.tests

schemes:
  TripCanvas:
    build:
      targets:
        TripCanvas: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TripCanvasTests
