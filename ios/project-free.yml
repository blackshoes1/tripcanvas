# 무료 Apple ID로 **내 아이폰에 올려 보기 위한** 스펙.
#
# App Group(group.com.fromj.trip)과 푸시(aps-environment)는 유료 Developer Program
# 에서만 발급된다. 무료 계정으로 project.yml 을 쓰면 서명 단계에서 막힌다.
# 그래서 여기서는 **본체 앱 하나만** 만든다.
#
# 이 스펙으로 빠지는 것: 위젯 · Live Activity(잠금화면·Dynamic Island) · 공유 확장 · Watch.
# 앱 코드는 그대로 두어도 안전하다 — App Group 접근은 UserDefaults? 라 nil 로 떨어지고,
# Live Activity 는 areActivitiesEnabled 가 false 라 조용히 건너뛴다.
#
#   cd ios && xcodegen generate --spec project-free.yml && open TripCanvasFree.xcodeproj
#
# 전체 기능을 보려면 유료 멤버십 + project.yml 을 쓸 것.
name: TripCanvasFree
options:
  bundleIdPrefix: com.fromj
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# 지도 SDK — 처음 들어온 외부 의존성이다. 둘 다 바이너리 xcframework라 빌드가 아니라 링크만 한다.
#   구글: iOS 16+, 해외 지도 · 카카오: 국내 지도(POI 탭 신원을 주지 않는 제약은 웹과 같다)
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "11.1.0"
  KakaoMapsSDK:
    url: https://github.com/kakao-mapsSDK/KakaoMapsSDK-SPM
    from: "2.12.19"

targets:
  TripCanvas:
    type: application
    platform: iOS
    sources:
      - path: TripCanvas
      - path: TripCanvasShared
    info:
      path: TripCanvasFree-Info.plist
      properties:
        CFBundleDisplayName: With J
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 첫 실행에 권한을 몰아 요청하지 않는다 — 쓸모를 설명할 수 있을 때 묻는다(§6·§42).
        NSLocationWhenInUseUsageDescription: 다음 장소까지 걸리는 시간과 나서기 좋은 시간을 알려드리기 위해 사용합니다. 위치는 그때 계산에만 쓰고 저장하지 않습니다.
        # 운영 API는 NAS다(2026-09-04 전환) — Tailscale Funnel이 ts.net 이름에 HTTPS를 붙인다.
        # 로컬 서버로 붙일 때만 이 값을 바꾼다(그때는 http라 NSAppTransportSecurity 예외가 필요하다).
        TCApiBaseURL: "https://bokbok9.tail8b977f.ts.net"
        # 지도 SDK 네이티브 키 — 번들 ID 제한(com.fromj.trip). 무료 스펙에서 번들 ID를 바꿨다면 콘솔의 제한에 그 값도 넣는다.
        TCGoogleMapsKey: "AIzaSyC5b_lS9bW-qGFnL9KQ0Kn8SBr0a0VodIg"
        TCKakaoNativeKey: "fd08ca0a759ed5b4f1240887ed814957"
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - package: KakaoMapsSDK
        product: KakaoMapsSDK-SPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fromj.trip
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  TripCanvas:
    build:
      targets:
        TripCanvas: all
    run:
      config: Debug
