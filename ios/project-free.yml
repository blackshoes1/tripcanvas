# 무료 Apple ID로 **내 아이폰에 올려 보기 위한** 스펙.
#
# App Group(group.ai.tripcanvas.ios)과 푸시(aps-environment)는 유료 Developer Program
# 에서만 발급된다. 무료 계정으로 project.yml 을 쓰면 서명 단계에서 막힌다.
# 그래서 여기서는 **본체 앱 하나만** 만든다.
#
# 이 스펙으로 빠지는 것: 위젯 · Live Activity(잠금화면·Dynamic Island) · 공유 확장 · Watch.
# 앱 코드는 그대로 두어도 안전하다 — App Group 접근은 UserDefaults? 라 nil 로 떨어지고,
# Live Activity 는 areActivitiesEnabled 가 false 라 조용히 건너뛴다.
#
#   cd ios && xcodegen generate --spec project-free.yml && open TripCanvasFree.xcodeproj
#
# 전체 기능을 보려면 유료 멤버십 + project.yml 을 쓸 것.
name: TripCanvasFree
options:
  bundleIdPrefix: ai.tripcanvas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TripCanvas:
    type: application
    platform: iOS
    sources:
      - path: TripCanvas
      - path: TripCanvasShared
    info:
      path: TripCanvasFree-Info.plist
      properties:
        CFBundleDisplayName: TripCanvas
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 첫 실행에 권한을 몰아 요청하지 않는다 — 쓸모를 설명할 수 있을 때 묻는다(§6·§42).
        NSLocationWhenInUseUsageDescription: 다음 장소까지 걸리는 시간과 나서기 좋은 시간을 알려드리기 위해 사용합니다. 위치는 그때 계산에만 쓰고 저장하지 않습니다.
        # /api/v1 은 정적 웹이 아니라 별도 Next 프로젝트가 서빙한다.
        TCApiBaseURL: "https://tripcanvas-api.vercel.app"
        TCSupabaseURL: ""
        TCSupabaseAnonKey: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tripcanvas.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  TripCanvas:
    build:
      targets:
        TripCanvas: all
    run:
      config: Debug
